# Apache vhost voor radio.hodc.nl
# Plaatsen als: /etc/apache2/sites-available/radio.hodc.nl.conf
# Activeren met: a2ensite radio.hodc.nl && systemctl reload apache2
#
# Cloudflare termineert TLS; de tunnel op herm praat plain http met
# localhost:80 (ingress '*.hodc.nl'). Daarom staat hier geen :443-blok en is
# certbot niet nodig.

<VirtualHost *:80>
    ServerName radio.hodc.nl
    DocumentRoot /var/www/radio.hodc.nl

    # De pagina is puur statisch; alles staat in één bestand.
    <Directory /var/www/radio.hodc.nl>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Zonder dit rendert "Curaçao" als "CuraÃ§ao".
    AddDefaultCharset utf-8

    # index.html bevat de zenderlijst en verandert bij elke aanpassing,
    # dus niet cachen; dat scheelt "waarom zie ik mijn nieuwe zender niet".
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  ${APACHE_LOG_DIR}/radio.hodc.nl-error.log
    CustomLog ${APACHE_LOG_DIR}/radio.hodc.nl-access.log combined
</VirtualHost>
